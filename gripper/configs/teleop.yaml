teleop:
  device: keyboard
  arm: right

sensitivity:
  pos_sensitivity: 1.0
  rot_sensitivity: 1.0

control:
  translation_enabled: true
  rotation_enabled: true
  gripper_enabled: true
  invert_x: false
  invert_y: false
  invert_z: false
  invert_roll: false
  invert_pitch: false
  invert_yaw: false

action_filter:
  zero_small_actions: true
  action_epsilon: 1.0e-4
  clip_translation: 1.0
  clip_rotation: 1.0
  clip_gripper: 1.0

keys:
  move_x_pos: d
  move_x_neg: a
  move_y_pos: w
  move_y_neg: s
  move_z_pos: r
  move_z_neg: f

  yaw_pos: e
  yaw_neg: q
  pitch_pos: t
  pitch_neg: g
  roll_pos: z
  roll_neg: x

  gripper_toggle: space
  reset_episode: backspace
  quit: escape

episode:
  reset_on_success: false
  reset_on_failure: true
  timeout_steps: 300

recording:
  enabled: true
  save_images: true
  save_actions: true
  save_robot_state: true
  save_object_state: true
  save_every_step: false
  
  save_only_successful_episodes: false