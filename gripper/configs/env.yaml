env:
  env_name: Lift
  robot: UR5e
  gripper: default
  controller: BASIC

render:
  has_renderer: true
  has_offscreen_renderer: false
  render_camera: frontview
  use_camera_obs: false
  use_object_obs: false

control:
  control_freq: 20
  horizon: 1000
  ignore_done: true

task:
  primitive: pick
  instruction: "pick up hammer"

object:
  type: hammer
  randomize_position: true
  randomize_yaw: true
  x_range: [-0.08, 0.08]
  y_range: [-0.08, 0.08]
  yaw_range: [-3.1416, 3.1416]
  z_offset: 0.01

success:
  lift_height: 0.06
  hold_steps: 8
  max_episode_steps: 300

workspace:
  table_full_size: [0.8, 0.8, 0.05]
  table_offset: [0.0, 0.0, 0.8]

dataset:
  save_rgb: true
  save_depth: false
  save_actions: true
  save_robot_state: true
  save_object_state: true
  save_every_step: true